appId: com.notch.app
productName: Notch
directories:
  output: dist
files:
  - "dist/renderer/**/*"
  - "src/main/**/*"
  - "src/preload/**/*"
  - "package.json"
win:
  target:
    - nsis
  artifactName: "Notch-${version}-setup.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
