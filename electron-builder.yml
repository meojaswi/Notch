appId: com.notch.app
productName: Notch
directories:
  output: dist
files:
  - "dist/**/*"
  - "electron/**/*"
  - "src/**/*"
  - "package.json"
win:
  target:
    - nsis
  artifactName: "Notch-${version}-setup.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
